# Linux core CI (design §20 A9). Windows and macOS legs come after v0.1.0.
name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip (26.1 or later understands --uploaded-prior-to P14D)
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install the dev set under the two-week rule (PKG-09)
        run: python -m pip install --uploaded-prior-to P14D -r requirements-dev.txt

      - name: Install reviewed security-exception pins (D-18)
        run: |
          python tools/check_dependency_age.py --pins > "$RUNNER_TEMP/pins.txt"
          if [ -s "$RUNNER_TEMP/pins.txt" ]; then
            python -m pip install -r "$RUNNER_TEMP/pins.txt"
          else
            echo "No reviewed security-exception pins to install."
          fi

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q

      - name: Dependency age, two-week rule (PKG-09)
        run: python tools/check_dependency_age.py

      - name: Licence allow-list (D-12)
        run: python tools/check_licences.py

      - name: Plugin manifests (D-02)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict && claude plugin validate ./plugin --strict
          else
            echo "claude CLI not installed; skipping plugin validate (D-02)"
          fi
