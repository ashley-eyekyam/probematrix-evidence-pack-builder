# Tool configuration only. This repository is not an installable Python package:
# the plugin ships from plugin/ and runs from its own private environment.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin/skills/evidence-pack/scripts", "tools", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
markers = [
    "network: needs network access; runs only when EPB_NETWORK_TESTS=1",
    "host: drives a real Claude Code or Codex CLI; runs only when EPB_HOST_TESTS=1",
]
# openpyxl's create_temporary_file opens a text-mode temp file with no encoding; our own code stays an error.
filterwarnings = [
    "error::EncodingWarning",
    "ignore:'encoding' argument not specified:EncodingWarning:openpyxl\\.worksheet\\._writer",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# ruff also formats Python code blocks inside Markdown. .planning/ holds GSD planning
# documents whose snippets are illustrative, so ruff leaves them alone.
extend-exclude = ["docs/reference", ".planning"]

[tool.ruff.lint]
# PLW1514 (explicit encoding= on open()) is preview-only in ruff 0.16.10.
# S506 forbids unsafe YAML loading.
select = ["E4", "E7", "E9", "F", "I", "B", "S506", "PLW1514"]
preview = true
explicit-preview-rules = true
